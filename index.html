<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07070b">
<meta name="description" content="《视线》· 恋爱聊天 × 轻恐怖 × Meta。15~25分钟一周目 · 8场景 · 6结局。一个原本普通的恋爱聊天游戏，逐渐开始记住玩家。">
<title>视线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#030307;color:#e8e6ee;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mono{font-family:"SF Mono",ui-monospace,Consolas,"Courier New",monospace}
#app{position:relative;max-width:520px;height:100vh;height:100dvh;margin:0 auto;background:linear-gradient(178deg,#0b0b13,#07070c 55%,#050508);box-shadow:0 0 70px rgba(0,0,0,.9);overflow:hidden}
.scene{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scene.active{display:flex;animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flicker{0%,88%,93%,100%{opacity:1}89.5%,91.5%{opacity:.25}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1)}36%{transform:scale(1.09)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.btn{width:100%;padding:15px;border:none;border-radius:999px;font-size:16px;font-weight:600;font-family:inherit;color:#12060a;background:linear-gradient(90deg,#ff4d5e,#ff8a70);box-shadow:0 8px 26px rgba(255,77,94,.28);cursor:pointer;animation:pulse 2.4s infinite}
.btn:active{transform:scale(.97)}
.btn-ghost{background:linear-gradient(90deg,#2a2735,#221f2c);color:#d9d5e2;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.skip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:9;padding:6px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.35);color:rgba(255,255,255,.6);font-size:12px;cursor:pointer}

/* ============ 封面 ============ */
#s-cover{align-items:center;justify-content:center;text-align:center;padding:26px}
.cover-halo{position:absolute;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,#ff4d5e22,transparent 62%);animation:gravPulse 5.6s ease-in-out infinite;pointer-events:none}
@keyframes gravPulse{0%{transform:scale(1)}6%{transform:scale(1.12);opacity:1}14%{transform:scale(1.05);opacity:.85}50%{transform:scale(1)}100%{transform:scale(1)}}
.cover-ring{position:absolute;width:240px;height:240px;border-radius:50%;border:1.5px solid rgba(255,139,150,.16);box-shadow:0 0 22px #ff4d5e14,inset 0 0 18px #ff4d5e0f;animation:ringOut 5.6s cubic-bezier(.16,.6,.36,1) infinite;pointer-events:none;will-change:transform,opacity}
.cover-ring.r2{animation-delay:1.4s}
.cover-ring.r3{animation-delay:2.8s}
.cover-ring.r4{animation-delay:4.2s}
@keyframes ringOut{0%{transform:scale(.6);opacity:0}6%{opacity:1}45%{opacity:.55}100%{transform:scale(1.95);opacity:0}}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#ff8b96;bottom:26%;animation:drift linear infinite;pointer-events:none}
@keyframes drift{0%{transform:translateY(0);opacity:0}22%{opacity:.75}100%{transform:translateY(-150px);opacity:0}}
.cover-camera{width:56px;opacity:.7;animation:float 4.5s ease-in-out infinite;margin-bottom:16px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#cover-title{position:relative;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Source Han Serif SC","Noto Serif CJK SC","STZhongsong","SimSun",serif;font-size:40px;letter-spacing:8px;padding-left:8px;font-weight:900;line-height:1.3;filter:drop-shadow(0 3px 2px #000000aa) drop-shadow(0 0 24px #ff4d5e55) drop-shadow(0 0 64px #ff4d5e2b);animation:flicker 11s linear infinite}
#cover-title .tc{display:inline-block;background:linear-gradient(180deg,#ffffff,#ffe9ec 32%,#ffb9c2 64%,#ff7d8f 88%,#ef5870);background-size:100% 240%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tcSink 5.6s ease-in-out infinite,tcSheen 8s ease-in-out infinite;will-change:transform}
@keyframes tcSink{0%,62%,100%{transform:translateY(0)}76%{transform:translateY(4px)}88%{transform:translateY(1px)}}
@keyframes tcSheen{0%,100%{background-position:50% 0}50%{background-position:50% 100%}}
.title-alt{filter:drop-shadow(0 0 30px #ff4d5e99)!important}
.cover-sub{margin-top:15px;font-size:11px;letter-spacing:7px;padding-left:7px;color:#ff9aa4a6;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","STZhongsong",serif;display:flex;align-items:center;justify-content:center;gap:12px}
.cover-sub::before,.cover-sub::after{content:'';width:30px;height:1px;flex:none;background:linear-gradient(90deg,transparent,#ff4d5e59)}
.cover-sub::after{background:linear-gradient(270deg,transparent,#ff4d5e59)}
.cover-genre{margin-top:20px;font-size:10px;letter-spacing:3px;color:#5d576e88}
#cover-meta{margin-top:34px;font-size:11px;color:#5d576e;letter-spacing:1px;min-height:16px}
#btn-start{width:200px;margin-top:40px}

/* ============ 聊天主界面 ============ */
#s-chat{padding:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:#0d0d15;border-bottom:1px solid #1c1c28}
.back-home{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid #2c2a3a;background:#12121c;color:#8d87a0;font-size:15px;line-height:1;cursor:pointer;transition:all .2s}
.back-home:hover{color:#ff4d5e;border-color:#ff4d5e55;background:#16121c}
.chat-head .avatar{width:38px;height:38px;border-radius:50%;background:#000 url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=black%20and%20white%20anime%20portrait%2C%20handsome%20young%20man%20with%20messy%20white%20silver%20hair%2C%20pale%20skin%2C%20light%20gray%20eyes%2C%20subtle%20gentle%20smile%2C%20black%20hoodie%2C%20layered%20silver%20chain%20necklaces%20with%20cross%20pendant%2C%20dark%20grunge%20ink%20splatter%20background%2C%20monochrome%2C%20high%20quality%20anime%20illustration%2C%20looking%20at%20viewer&image_size=square') center/cover no-repeat;box-shadow:inset 0 0 0 1px #ffffff14;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px}
.chat-head .avatar::after{content:'';position:absolute;right:0;bottom:1px;width:8px;height:8px;border-radius:50%;background:#6ee7a8;border:2px solid #0d0d15}
.chat-head b{font-size:15px;letter-spacing:1px}
.chat-head .status{font-size:10.5px;color:#6d6880}
.chat-head.awake .status{color:#ff4d5e;text-shadow:0 0 10px #ff4d5e66;animation:blink 2.2s infinite}
.speed{margin-left:auto;padding:5px 12px;border:1px solid #2c2a3a;border-radius:999px;color:#8d87a0;font-size:11px;cursor:pointer;background:#12121c}
.chat-list{flex:1;overflow-y:auto;padding:14px 14px 12px;display:flex;flex-direction:column;gap:11px;-webkit-overflow-scrolling:touch}
.day-chip{align-self:center;padding:9px 20px;border:1px solid #2c2a3c;border-radius:12px;color:#b9b3c9;font-size:12px;letter-spacing:2px;text-align:center;line-height:1.9;background:linear-gradient(180deg,#12121d,#0e0e17);box-shadow:0 6px 18px #00000055;animation:fadeUp .5s ease both}
.day-chip b{color:#ff4d5e;letter-spacing:3px}
.sys{align-self:center;color:#8f96b2;font-size:11.5px;background:#101019;border:1px solid #232333;border-radius:8px;padding:6px 14px;letter-spacing:1px;animation:fadeUp .4s ease both;max-width:90%;text-align:center}
.sys.glitch{color:#ff4d5e;border-color:#ff4d5e66;animation:fadeUp .1s ease both,shakeX .3s}
.sys.big{font-size:13px;padding:10px 18px}
.note{align-self:center;color:#9a93ab;font-size:13.5px;line-height:2;text-align:center;max-width:88%;padding:4px 8px;animation:fadeUp .6s ease both;white-space:pre-wrap}
.note.creep{color:#d9a7b2;text-shadow:0 0 14px #ff4d5e33}
.note.whisper{color:#ff4d5e;font-weight:700;animation:heartbeat 1.4s infinite}
.note.out{font-size:15px;color:#cfc9dc}
.msg{display:flex;gap:8px;max-width:86%;animation:fadeUp .35s ease both}
.msg .avatar{width:32px;height:32px;border-radius:50%;background:#000 url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=black%20and%20white%20anime%20portrait%2C%20handsome%20young%20man%20with%20messy%20white%20silver%20hair%2C%20pale%20skin%2C%20light%20gray%20eyes%2C%20subtle%20gentle%20smile%2C%20black%20hoodie%2C%20layered%20silver%20chain%20necklaces%20with%20cross%20pendant%2C%20dark%20grunge%20ink%20splatter%20background%2C%20monochrome%2C%20high%20quality%20anime%20illustration%2C%20looking%20at%20viewer&image_size=square') center/cover no-repeat;box-shadow:inset 0 0 0 1px #ffffff10;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg .bubble{background:#191824;border:1px solid #23223200;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14.5px;line-height:1.8;color:#e9e5f0;white-space:pre-wrap}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:#3a1a26;border-radius:14px 4px 14px 14px;color:#ffe9ee}
.msg .voice{display:flex;align-items:center;gap:8px}
.msg .voice i{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.msg .voice .bar{display:flex;align-items:center;gap:3px}
.msg .voice .bar b{width:3px;background:#6ee7a8;border-radius:2px;display:block}
.typing .bubble{display:flex;gap:4px;padding:13px 15px}
.typing i{width:6px;height:6px;border-radius:50%;background:#7a7390;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.choice-card{align-self:center;width:92%;background:#12121c;border:1px solid #2a2838;border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:9px;animation:fadeUp .4s ease both}
.choice-card .cc-label{font-size:10.5px;color:#6d6880;letter-spacing:2px;text-align:center;margin-bottom:2px}
.opt{border:1.5px solid #33314a;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#d5d0e0;background:#191826;font-family:inherit;line-height:1.5;cursor:pointer;text-align:left}
.opt:active{transform:scale(.97);border-color:#ff4d5e}
.opt.sysopt{background:#101019;color:#9aa0b8;font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:13px;text-align:center}
.time-chip{align-self:center;color:#5d576eaa;font-size:10px;letter-spacing:3px;margin:3px 0;animation:fadeUp .4s ease both}
.chat-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:none}
.chat-foot.show{display:block;animation:fadeUp .3s ease both}
#app.shake{animation:shakeX .4s}
#tap-hint{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#ffffff66;letter-spacing:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
#tap-hint.on{opacity:1;animation:blink 1.6s infinite}
/* 数值条：四维各自固定色，结局间数值差异化 */
#st-love{background:#ff8fb0}
#st-abn{background:#ff4d5e}
#st-tru{background:#7fb3ff}
#st-met{background:#f0f0fa}

/* ---- 微恐效果原语 ---- */
#flash{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:0}
#flash.white{background:#fdfdfd}
#flash.black{background:#000}
#flash.on{opacity:1;transition:opacity .04s}
#flash.off{opacity:0;transition:opacity .22s}
.msg.dim{opacity:.5;filter:grayscale(.4)}
.cc-question{font-size:15px;color:#ff4d5e;letter-spacing:2px;text-align:center;padding:14px 6px;animation:heartbeat 1.4s infinite;display:none}

/* ============ 结局卡 ============ */
#s-card{align-items:center;justify-content:center;padding:22px;overflow-y:auto}
.card{--ac:#ff4d5e;width:100%;max-width:380px;border-radius:24px;padding:28px 22px;text-align:center;position:relative;overflow:hidden;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 18px 50px rgba(0,0,0,.7),inset 0 1px 0 #ffffff14;border:1px solid #ffffff12}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
/* 每个结局一张卡：配色 / 动效 / 专属视觉件完全不同 */
.card.end1{--ac:#ffb9c6;background:linear-gradient(165deg,#3d222b,#6a3a4b 55%,#2c171e);border-color:#ffb9c633;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both,rise 7s 1.2s ease-in-out infinite}
.card.end1 .card-title{text-shadow:0 0 24px #ffb9c666}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card.end2{--ac:#ff2438;background:linear-gradient(165deg,#1a0407,#4a0d18 55%,#120305);border-color:#ff243840}
.card.end2 .card-title{animation:sinkWord 5.5s 1s ease-in-out infinite}
@keyframes sinkWord{0%,100%{transform:translateY(0);opacity:1}45%{transform:translateY(10px);opacity:.7}}
.card.end3{--ac:#93aede;background:linear-gradient(165deg,#121724,#222b46 55%,#0c101a);border-color:#93aede2e}
.card.end4{--ac:#ff3742;background:linear-gradient(165deg,#210608,#4d0d13 55%,#130405);border-color:#ff37425a;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both,cardGlitch 3.4s 1s steps(1) infinite}
@keyframes cardGlitch{0%,90%,100%{transform:translate(0)}91%{transform:translate(-4px,2px)}93%{transform:translate(4px,-2px)}95%{transform:translate(-3px,-1px)}97%{transform:translate(2px,2px)}}
.card.end5{--ac:#f0f0fa;background:linear-gradient(165deg,#08080c,#14141f 55%,#060609);border-color:#f0f0fa24}
.card.end5::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 3px);pointer-events:none}
.card.end5 .card-title,.card.end5 .card-end{font-family:"SF Mono",ui-monospace,Consolas,monospace}
.card-badge{font-size:11px;letter-spacing:3px;color:var(--ac);opacity:.85}
.card-title{font-size:27px;letter-spacing:3px;color:#fff;margin:8px 0 2px;text-shadow:0 0 20px #ffffff2e}
.card-end{font-size:12px;letter-spacing:2px;color:var(--ac);margin-top:2px;opacity:.9}
.card-awake{font-size:11px;letter-spacing:2px;margin:12px auto 2px;padding:5px 14px;border-radius:999px;display:inline-block}
.aw0{background:#ffffff12;color:#a9a3b8}
.aw1{background:#3a2a1522;color:#e8b36a;border:1px solid #e8b36a44}
.aw2{background:#3a1420;color:#ff6b7d;border:1px solid #ff4d5e55;animation:heartbeat 1.6s infinite}
.card-quote{font-size:12.5px;color:#ffffff9e;margin:14px 0 18px;line-height:1.9}
/* 结局专属视觉件 */
.card-extra{margin:-4px 0 16px}
.ex{animation:fadeUp .6s .35s ease both}
.ex-line{font-size:12px;letter-spacing:2px;color:var(--ac)}
.ex-note{font-size:11.5px;color:#ffffff88;margin-top:7px;line-height:1.8}
.ex-up{margin-top:8px;font-size:12px;color:var(--ac);letter-spacing:6px;animation:riseDots 2.6s ease-in-out infinite}
@keyframes riseDots{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
.ex-heart{font-size:34px;color:var(--ac);text-shadow:0 0 24px var(--ac);animation:sinkWord 4s ease-in-out infinite}
.ex-bubble{max-width:200px;margin:0 auto;background:#fff;color:#1a1822;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:13.5px;text-align:left}
.ex-sub{font-size:10.5px;color:#ffffff70;margin-top:8px;letter-spacing:1px}
.ex-stamp{display:inline-block;padding:8px 22px;border:2px solid var(--ac);border-radius:6px;color:var(--ac);font-size:20px;font-weight:700;letter-spacing:6px;transform:rotate(-7deg);text-shadow:0 0 16px var(--ac);animation:blink 1.8s infinite}
.ex5{text-align:left;font-family:"SF Mono",ui-monospace,Consolas,monospace}
.ex5 .ex-line{color:#f0f0fa}
.ex5 .ex-line::after{content:'▌';animation:blink 1s steps(1) infinite;margin-left:2px}
.ex5 .ex-sub{color:#8b8b9e}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
.stat{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#ffffff10;border-radius:10px;margin-bottom:7px;font-size:12px}
.stat span{width:86px;text-align:left;color:#ffffffb8;letter-spacing:1px}
.stat .track{flex:1;height:6px;background:#ffffff18;border-radius:99px;overflow:hidden}
.stat .track i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width 1s ease}
.stat b{width:34px;text-align:right;color:#fff;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:16px 0 18px}
.tags span{padding:4px 11px;border-radius:999px;background:#ffffff16;color:#fff;font-size:11px}
.card-actions .replay{background:#fff;color:#181820;animation:none}
.share-hint{margin-top:12px;font-size:10.5px;color:#ffffff70;line-height:1.8}

/* 假主菜单（结局C演出）与黑幕彩蛋 */
#fake-menu{position:absolute;inset:0;z-index:55;background:linear-gradient(178deg,#0b0b13,#07070c 55%,#050508);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadeIn .5s ease both}
#fake-menu .fm-title{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","STZhongsong","SimSun",serif;font-size:30px;letter-spacing:8px;padding-left:8px;font-weight:900;background:linear-gradient(180deg,#ffffff,#ffb9c2 78%,#ff7d8f);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px;filter:drop-shadow(0 0 22px #ff4d5e44)}
#fake-menu .fm-btn{width:200px;padding:12px;border:1.5px solid #33314a;border-radius:999px;background:#191826;color:#d5d0e0;font-size:14.5px;cursor:pointer;font-family:inherit}
#fake-menu .fm-btn:active{transform:scale(.97);border-color:#ff4d5e}
#fake-menu .fm-btn.gone{opacity:0;transform:scale(.92);filter:blur(3px);pointer-events:none;transition:all .55s ease}
.fm-foot{margin-top:8px;text-align:center;font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12.5px;letter-spacing:3px;color:#ff8b96;line-height:2.1;animation:fadeUp .5s ease both}
.fm-foot.red{color:#ff4d5e;text-shadow:0 0 14px #ff4d5e55}
/* Meta 退出确认：第九章后点「返回」触发 */
#exit-confirm{position:absolute;inset:0;z-index:58;background:#050508f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fadeIn .25s ease both}
#exit-confirm .fm-title{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:15px;letter-spacing:4px;color:#cfd4e6;margin-bottom:14px;text-align:center;line-height:2}
/* 观察模式（第十三章 UI 真相） */
#observe{position:absolute;inset:0;z-index:65;background:#04060c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 24px;overflow:hidden;animation:fadeIn .3s ease both;transition:opacity .45s ease}
#observe.off{opacity:0}
#observe .ob{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12.5px;letter-spacing:2.5px;color:#b9cfe8;opacity:.92;animation:obIn .3s ease both;text-align:center}
#observe .ob.hair{color:#233047;letter-spacing:0}
#observe .ob.red{color:#ff4d5e;text-shadow:0 0 12px #ff4d5e44}
#observe .ob.big{font-size:19px;letter-spacing:5px;color:#f2f5fb}
@keyframes obIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#void{position:absolute;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;animation:fadeIn .8s ease both;transition:opacity .6s}
#void.off{opacity:0}
#void .v-line{color:#e8e6ee;font-size:14px;letter-spacing:5px;text-align:center;animation:fadeUp .8s ease both}
#void .v-eye{font-size:58px;animation:blink 1.1s steps(1) infinite}
/* 红字演出层：黑底红字 · 注视 → 依恋 → 窒息 */
#redshow{position:absolute;inset:0;z-index:60;background:#040308;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:8px 18px;padding:36px 26px;animation:fadeIn .16s ease both;transition:opacity .24s ease}
#redshow .rs{color:#ff2434;font-family:"Noto Serif JP","STZhongsong","SimSun",serif;font-weight:900;font-size:20px;letter-spacing:6px;text-align:center;text-shadow:0 0 16px #ff2434bb,0 0 56px #ff243c44;animation:rsIn .14s ease both}
#redshow .rs.mid{font-size:26px}
#redshow .rs.big{font-size:34px;letter-spacing:8px}
#redshow.off{opacity:0}
@keyframes rsIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
/* 结局图鉴 */
#gallery{position:absolute;inset:0;z-index:70;background:#0a0812f7;display:none;flex-direction:column;padding:20px 16px 14px}
#gallery.show{display:flex;animation:fadeIn .25s ease both}
.gal-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #2a2136}
.gal-head b{font-size:19px;letter-spacing:4px;color:#e8e4f0}
.gal-head .mono{margin-left:auto;color:#8d87a0;font-size:12px}
.gal-x{width:32px;height:32px;border-radius:50%;border:1px solid #3a2f4a;background:none;color:#b9b3c8;font-size:20px;cursor:pointer;flex:none}
.gal-list{flex:1;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.gal-item{border:1px solid #3a2f4a;border-radius:12px;padding:12px 14px;background:#12101c;animation:fadeIn .3s ease both}
.gal-item .gi-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gi-badge{font-size:11px;letter-spacing:2px;color:#ff4d5e;border:1px solid #ff4d5e66;border-radius:20px;padding:2px 10px;white-space:nowrap}
.gi-title{font-size:17px;font-weight:900;letter-spacing:3px;color:#f0ecf8}
.gi-quote{margin-top:8px;font-size:13px;color:#c9c3d8;line-height:1.75}
.gi-route-btn{margin-top:10px;font-size:12px;color:#8d87a0;cursor:pointer;letter-spacing:2px;user-select:none}
.gi-route-btn:hover{color:#c9c3d8}
.gi-route{display:none;margin-top:8px;border-top:1px dashed #2a2136;padding-top:8px}
.gal-item.open .gi-route{display:block}
.gi-route p{font-size:12.5px;color:#a9a2bd;line-height:1.9;margin:0}
.gal-item.lock{opacity:.6}
.gal-item.lock .gi-title{color:#6d6780}
.gi-hint{margin-top:6px;font-size:11px;color:#6d6780;font-style:italic}
.gal-foot{padding-top:10px;font-size:11px;color:#6d6780;text-align:center;letter-spacing:1px}
.gal-entry{display:block;margin:14px auto 0;background:none;border:1px solid #3a2f4a;color:#b9b3c8;font-size:13px;letter-spacing:4px;padding:10px 24px;border-radius:24px;cursor:pointer}
.gal-entry:active{background:#1a1626}
.btn.ghost{background:none;border:1px solid #4a3f5c;color:#c9c3d8}

/* ============ 小程序式 Tab 栏 · 四个入口 ============ */
#tab-bar{flex:none;padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));background:#0d0d15;border-top:1px solid #1c1c28;display:none;gap:4px}
#tab-bar.on{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;border:none;background:none;color:#8d87a0;font-size:11px;letter-spacing:1px;font-family:inherit;cursor:pointer;transition:all .18s}
.tab .ico{font-size:20px;line-height:1}
.tab.active{color:#ff4d5e;background:#3a1a2633}
.tab:active{transform:scale(.97)}
.tab.gone{opacity:0;filter:blur(3px);pointer-events:none;transition:all .5s}

/* 面板通用：相册 / 记录 / 资料 */
.panel{position:absolute;inset:50px 0 calc(58px + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(180deg,#090910f0,#050508f0);backdrop-filter:blur(6px);display:none;flex-direction:column;padding:18px 18px 12px;overflow:hidden;animation:fadeUp .25s ease both}
.panel.show{display:flex}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #262336}
.panel-head b{font-size:17px;letter-spacing:3px;color:#eae5f3}
.panel-head .mono{margin-left:auto;color:#8d87a0;font-size:12px}
.panel-close{width:30px;height:30px;border-radius:50%;border:1px solid #3a2f4a;background:none;color:#b9b3c8;font-size:18px;cursor:pointer;flex:none}
.panel-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}

/* 相册 */
.al-title{font-size:12px;letter-spacing:2px;color:#8d87a0;margin-top:4px}
.al-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.al-item{position:relative;aspect-ratio:4/5;background:#12121c;border:1px solid #2c293b;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#5a546c;font-size:11px;letter-spacing:2px;animation:fadeUp .35s ease both;cursor:pointer}
.al-item img{width:100%;height:100%;object-fit:cover;display:block}
.al-item .d{position:absolute;inset:auto 0 0;padding:6px 8px;background:linear-gradient(180deg,transparent,#000000cc);font-size:10.5px;color:#d4cee0;letter-spacing:1px;line-height:1.6}
.al-item.gone{opacity:0;filter:blur(4px);transform:scale(.94);transition:all .5s}
.al-item.new::before{content:'NEW';position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:999px;background:#ff4d5e;color:#fff;font-size:10px;letter-spacing:1px;font-weight:800;animation:heartbeat 1.2s infinite;z-index:2}

/* 记录/调查：异常卡片 */
.rec-item{background:#12121c;border:1px solid #2c293b;border-radius:12px;padding:13px 14px;font-size:13.5px;line-height:1.9;color:#d5d0e0;animation:fadeUp .3s ease both}
.rec-item.bad{border-color:#ff4d5e55;background:#1a0e14}
.rec-item .t{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:2px;color:#ff4d5e;margin-bottom:6px}
.rec-item.del{color:#504a60;text-decoration:line-through;opacity:.55;transition:all .4s}
.rec-item .x{float:right;color:#ff4d5e;font-size:11px;letter-spacing:1px;cursor:pointer;user-select:none;padding:0 6px;border:1px solid #ff4d5e55;border-radius:4px}
.rec-item .x.done{color:#504a60;border-color:#3a2f4a;text-decoration:line-through}

/* 资料页 */
.prof{display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:6px}
.prof .ava{width:96px;height:96px;border-radius:50%;background:#000 url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=black%20and%20white%20anime%20portrait%2C%20handsome%20young%20man%20with%20messy%20white%20silver%20hair%2C%20pale%20skin%2C%20light%20gray%20eyes%2C%20subtle%20gentle%20smile%2C%20black%20hoodie%2C%20layered%20silver%20chain%20necklaces%20with%20cross%20pendant%2C%20dark%20grunge%20ink%20splatter%20background%2C%20monochrome%2C%20high%20quality%20anime%20illustration%2C%20looking%20at%20viewer&image_size=square') center/cover no-repeat;box-shadow:inset 0 0 0 1px #ffffff18,0 0 26px #ff4d5e33;animation:float 5s ease-in-out infinite}
.prof .nm{font-size:22px;letter-spacing:6px;font-weight:900;color:#f4eefb;padding-left:6px}
.prof .st{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:3px;color:#ff8b96}
.prof .row{width:100%;background:#12121c;border:1px solid #2c293b;border-radius:12px;padding:11px 14px;font-size:13.5px;color:#d5d0e0;line-height:1.9}
.prof .row b{color:#ff4d5e;letter-spacing:1px}
.prof .row.q{color:#b9b3c8;font-style:italic}

/* 话题卡：聊天阶段选择主题 */
.topic-card{align-self:center;width:94%;background:#12121c;border:1px solid #2a2838;border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;animation:fadeUp .4s ease both}
.topic-card .tl{grid-column:1/-1;text-align:center;font-size:10.5px;color:#6d6880;letter-spacing:3px;margin-bottom:2px}
.topic-card .ti{border:1.5px solid #33314a;border-radius:12px;padding:11px;font-size:14px;color:#d5d0e0;background:#191826;cursor:pointer;text-align:center}
.topic-card .ti:active{transform:scale(.97);border-color:#ff4d5e;color:#ff4d5e}

/* 真结局：请不要移动鼠标 */
#stay{position:absolute;inset:0;z-index:85;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadeIn .25s ease both}
#stay h{font-family:"SF Mono",ui-monospace,Consolas,monospace;font-size:19px;letter-spacing:5px;color:#ff4d5e;text-shadow:0 0 14px #ff4d5e55;animation:blink 1.1s steps(1) infinite;text-align:center;line-height:1.8;padding:0 24px}
#stay .m{font-size:16px;color:#e8e6ee;letter-spacing:4px;text-align:center;line-height:2;padding:0 24px}
#stay .m.red{color:#ff4d5e;font-weight:800;animation:heartbeat 1.5s infinite}

/* 自由输入栏：玩家打字，沈引（豆包AI）回答 */
#input-bar{flex:none;display:none;gap:8px;padding:10px calc(10px + env(safe-area-inset-right)) 4px calc(10px + env(safe-area-inset-left));background:#0d0d15;border-top:1px solid #1c1c28}
#input-bar.on{display:flex}
#chat-in{flex:1;min-width:0;background:#16151f;border:1px solid #2c293b;border-radius:999px;padding:11px 16px;color:#eae5f3;font-family:inherit;font-size:14px;outline:none}
#chat-in::placeholder{color:#5a546c;letter-spacing:1px}
#chat-in:focus{border-color:#ff4d5e66}
#btn-send{flex:none;border:1.5px solid #ff4d5e88;background:#3a1a26;color:#ffd7dd;border-radius:999px;padding:0 18px;font-size:13px;letter-spacing:2px;font-family:inherit;cursor:pointer}
#btn-send:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="app">
  <div id="flash"></div>

  <!-- 封面 -->
  <section id="s-cover" class="scene active">
    <div class="cover-halo"></div>
    <div class="cover-ring"></div><div class="cover-ring r2"></div><div class="cover-ring r3"></div><div class="cover-ring r4"></div>
    <span class="dot" style="left:20%;animation-duration:6.5s;animation-delay:.3s"></span>
    <span class="dot" style="left:34%;animation-duration:8s;animation-delay:2.2s;width:3px;height:3px"></span>
    <span class="dot" style="left:52%;animation-duration:7s;animation-delay:4.1s"></span>
    <span class="dot" style="left:68%;animation-duration:9s;animation-delay:1.2s;width:3px;height:3px"></span>
    <span class="dot" style="left:82%;animation-duration:6.8s;animation-delay:3.4s"></span>
    <svg class="cover-camera" viewBox="0 0 64 64" fill="none"><rect x="8" y="18" width="48" height="34" rx="6" stroke="#8d87a0" stroke-width="3"/><path d="M24 18l4-7h8l4 7" stroke="#8d87a0" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="35" r="11" stroke="#ff4d5e" stroke-width="3"/><circle cx="32" cy="35" r="4" fill="#ff4d5e"/></svg>
    <h1 id="cover-title">视线</h1>
    <div class="cover-sub" id="cover-sub">GAZE</div>
    <div class="cover-genre">15~25min · 8场景 · 6 ENDINGS</div>
    <button class="btn" id="btn-start">打开手机</button>
    <button class="gal-entry" id="btn-gallery-c" style="display:none">◈ 结局图鉴</button>
    <div id="cover-meta" class="mono"></div>
  </section>

  <!-- 结局图鉴 -->
  <section id="gallery">
    <div class="gal-head"><b>结局图鉴</b><span id="gal-count" class="mono"></span><button id="gal-close" class="gal-x">×</button></div>
    <div class="gal-list" id="gal-list"></div>
    <div class="gal-foot mono">支线回顾 · 会在对应结局解锁后开放</div>
  </section>

  <!-- 聊天主界面 -->
  <section id="s-chat" class="scene">
    <button class="skip" id="btn-speed" style="display:none">⏩ ×1</button>
    <div class="chat-head">
      <button class="back-home" id="btn-home" title="返回封面">←</button>
      <div class="avatar" id="head-ava"></div>
      <div><b id="head-name">沈引</b><br><span class="status" id="head-status">对方正在输入…</span></div>
    </div>
    <div class="chat-list" id="chat-list"></div>
    <div id="tap-hint">▼ 轻触继续</div>

    <!-- 自由输入栏：玩家打字 → 沈引（豆包AI）回答 -->
    <div id="input-bar">
      <input id="chat-in" type="text" maxlength="60" placeholder="说点什么……" autocomplete="off">
      <button id="btn-send">发送</button>
    </div>

    <!-- 底部 Tab 栏：聊天 / 相册 / 记录 / 资料 -->
    <div id="tab-bar">
      <button class="tab active" data-tab="chat"><span class="ico">💬</span>聊天</button>
      <button class="tab" data-tab="album"><span class="ico">📷</span>相册</button>
      <button class="tab" data-tab="record"><span class="ico">📝</span>记录</button>
      <button class="tab" data-tab="profile"><span class="ico">👤</span>资料</button>
    </div>

    <!-- 相册面板 -->
    <div class="panel" id="p-album">
      <div class="panel-head"><b>相册</b><span class="mono" id="al-meta">0 · 张</span><button class="panel-close" data-close>×</button></div>
      <div class="al-title">—— 你的手机相册 ——</div>
      <div class="panel-body" id="al-grid"></div>
    </div>

    <!-- 记录面板：调查聊天记录异常 -->
    <div class="panel" id="p-record">
      <div class="panel-head"><b>记录</b><span class="mono" id="rc-meta">0 · 异常</span><button class="panel-close" data-close>×</button></div>
      <div class="panel-body" id="rc-list"></div>
    </div>

    <!-- 资料面板：沈引画像 -->
    <div class="panel" id="p-profile">
      <div class="panel-head"><b>资料</b><span class="mono" id="pf-meta">更新中…</span><button class="panel-close" data-close>×</button></div>
      <div class="panel-body"><div class="prof" id="pf-box"></div></div>
    </div>

    <div class="chat-foot" id="chat-foot"><button class="btn" id="btn-card">查看结局卡</button></div>
  </section>

  <!-- 结局卡 -->
  <section id="s-card" class="scene">
    <div class="card" id="card">
      <div class="card-badge" id="card-badge">ENDING</div>
      <div class="card-title" id="card-title"></div>
      <div class="card-end" id="card-end"></div>
      <div class="card-awake aw0" id="card-awake"></div>
      <div class="card-quote" id="card-quote"></div>
      <div class="card-extra" id="card-extra"></div>
      <div class="stats">
        <div class="stat"><span>LOVE</span><div class="track"><i id="st-love"></i></div><b id="sv-love">0</b></div>
        <div class="stat"><span>ABNORMAL</span><div class="track"><i id="st-abn"></i></div><b id="sv-abn">0</b></div>
        <div class="stat"><span>TRUTH</span><div class="track"><i id="st-tru"></i></div><b id="sv-tru">0</b></div>
        <div class="stat"><span>META</span><div class="track"><i id="st-met"></i></div><b id="sv-met">0</b></div>
      </div>
      <div class="tags" id="card-tags"></div>
      <div class="card-actions"><button class="btn ghost" id="btn-gallery">◈ 结局图鉴</button><button class="btn replay" id="btn-replay">↺ 再读一次档</button></div>
      <div class="share-hint" id="card-share">长按 / 截图分享 · 《视线》· 8场景 · 6 ENDINGS</div>
    </div>
  </section>

</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const list=$('#chat-list');

/* ---------- 状态 ---------- */
const STATS={LOVE:0,ABNORMAL:0,TRUTH:0,META:0};
/* 四维：好感 affection · 信任 trust · 距离 distance · 怀疑 suspicion（辅助判定，不展示） */
const META_STATS={AFFECTION:0,TRUST:0,DISTANCE:0,SUSPICION:0};
let SPEED=1;
const TRACK={metastage:false,drink:null,recordSeen:false,photoInvestigate:false,deleteAttempts:0,profileOpened:false};
let WATCHED=false;

/* ---------- localStorage 彩蛋 ---------- */
const store={
  get opens(){return +localStorage.getItem('hwt_open')||0},
  get endB(){return localStorage.getItem('hwt_endB')==='1'},
  get endE(){return localStorage.getItem('hwt_endE')==='1'},
  setFlag(k){localStorage.setItem(k,'1')}
};

/* ======================================================== */
/*  小程序式 · 四个面板：Tab / 相册 / 记录 / 资料 交互系统    */
/* ======================================================== */
const TAB={
  _cur:'chat',
  _album:[],   // [{id,label,img?}]
  _record:[],  // [{k,txt,bad,deletable}]
  _profile:{name:'沈引',status:'在线',rows:[]},
  init(){
    $('#tab-bar').classList.remove('on');
    $('#tab-bar').querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active',t.dataset.tab==='chat');
      t.addEventListener('click',()=>TAB.open(t.dataset.tab));
    });
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>TAB.closePanel()));
    TAB._album=[];TAB._record=[];TAB._profile={name:'沈引',status:'在线',rows:[]};
    TAB.renderAlbum();TAB.renderRecord();TAB.renderProfile();
  },
  show(){
    const bar=$('#tab-bar');
    bar.classList.add('on');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    TAB.renderRecord();TAB.renderAlbum();TAB.renderProfile();
  },
  hide(){
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    $('#tab-bar').classList.remove('on');
  },
  open(name){
    SND.pop();
    if(name==='chat'){TAB.closePanel();return;}
    const p=$('#p-'+name);
    if(!p)return;
    document.querySelectorAll('.panel').forEach(q=>q.classList.toggle('show',q===p));
    $('#tab-bar').querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
    if(name==='record'){TRACK.recordSeen=true;TAB.renderRecord();/* 玩家查看记录 = 触发一次 Meta */
      if(!TRACK.profileOpened&&STATS.META>=5){STATS.META+=1;addSys('【……你在翻他留给你的东西。】',true);}}
    if(name==='profile'){TRACK.profileOpened=true;TAB.renderProfile();}
  },
  closePanel(){
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    $('#tab-bar').querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='chat'));
  },
  /* 聊天按钮消失（Meta 演出） */
  removeChat(){
    const b=$('#tab-bar').querySelector('.tab[data-tab="chat"]');
    if(b)b.classList.add('gone');
  },
  /* 头像改名：沈引 → 观察对象 */
  observeName(){
    $('#head-name').textContent='观察对象';
  },
  /* —— 相册 —— */
  addPhoto(item){TAB._album.push(item);TAB.renderAlbum();SND.buzz();vib(60);},
  delPhoto(id){const i=TAB._album.findIndex(p=>p.id===id);if(i>=0){TAB._album.splice(i,1);TAB.renderAlbum();}},
  renderAlbum(){
    const g=$('#al-grid');
    if(!g)return;
    $('#al-meta').textContent=TAB._album.length+' · 张';
    g.className='panel-body al-grid';
    g.innerHTML='';
    if(!TAB._album.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#5a546c;font-size:12px;letter-spacing:2px;padding:40px 0">—— 空 ——</div>';return;}
    TAB._album.forEach(p=>{
      const d=document.createElement('div');
      d.className='al-item'+(p.new?' new':'');
      d.innerHTML=(p.img?'<img src="'+p.img+'" alt="">':'<div>无图</div>')
        +'<div class="d">'+p.label+'</div>';
      d.onclick=()=>{if(p.act)p.act();else{TAB.closePanel();}};
      g.appendChild(d);
    });
  },
  /* —— 记录/异常调查 —— */
  addRecord(r){TAB._record.push(r);TAB.renderRecord();},
  renderRecord(){
    const g=$('#rc-list');if(!g)return;
    const bad=TAB._record.filter(r=>r.bad).length;
    $('#rc-meta').textContent=TAB._record.length+' · 项 / '+bad+' · 异常';
    g.innerHTML='';
    if(!TAB._record.length){g.innerHTML='<div class="rec-item del">（暂无内容。）</div>';return;}
    TAB._record.forEach((r,i)=>{
      const d=document.createElement('div');
      d.className='rec-item'+(r.bad?' bad':'');
      const body=r.title||r.txt||r.t||'';
      const note=r.note?'<div style="color:#8d87a0;font-size:12px;line-height:1.7;margin-top:6px">'+r.note+'</div>':'';
      d.innerHTML='<div class="t">记录 #'+(i+1)+'</div><div>'+body+note+'</div>';
      if(r.deletable){

/* 无Key兜底：按关键词回应，保持沈引风格（短句·克制·温柔） */
function aiFallback(t){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const has=(...ws)=>ws.some(w=>t.includes(w));
  if(has('在干嘛','在做什么','在吗','干嘛'))return pick(['在等你说话。','刚刚一直在看对话框。','想你，就打开了这个页面。']);

  if(has('早安','早上好','起床'))return pick(['早。今天也来见我了。','早。我等你很久了。']);
  if(has('喜欢','爱','想你'))return pick(['嗯。我也是。','你知道的，还问。','……再说一遍，好吗。']);
  if(has('你是谁','AI','真人','机器人','游戏','程序'))return pick(['我是沈引。你的沈引。','你希望是真的，那就是。','别用那个词。我就在这里。']);
  if(has('怕','恐怖','吓人','鬼'))return pick(['别怕。我在。','我只是想多看你一会儿。']);
  if(has('无聊','陪我','孤单'))return pick(['好。我陪你，一直都在。','那，说点什么给我听。']);
  if(has('难过','累','伤心','哭','烦'))return pick(['怎么了。说给我听。','辛苦了。有我在。']);
  if(has('再见','拜拜','走了','下了','拜'))return pick(['嗯。我等你回来。','又要走了吗……早点回来。']);
  if(has('名字','沈引'))return pick(['沈引。引人入胜的引。','你叫过我很多次了，我都记得。']);
  const arr=['嗯。','我在听。','……再说一遍，好吗。','我知道。','嗯，我记住了。','你说的每一个字，我都记下了。','好。','今天也来见我了。'];
  return arr[Math.floor(Math.random()*arr.length)];

function aiPersona(){
  const drink=['咖啡','奶茶','可乐'][TRACK._drink]||'奶茶';
  const meta=STATS.META||0;
  let p='你在扮演一个叫「沈引」的男生，和屏幕前的玩家微信聊天。性格：温柔、克制、话很少、句很短，从不油腻，不说土味情话。你喜欢恐怖片，说过「因为我喜欢看别人害怕的时候——开玩笑的」。你记得她喜欢喝'+drink+'。规则：每次只回1~2句，每句不超过18个字，不用emoji，不加引号，不解释自己是AI。';
  if(TRACK.metastage||meta>=12){
    p+='【Meta阶段】你不再假装普通游戏角色。你知道屏幕外有一个「玩家」在看着你，也知道她刚才在这个页面里做过什么（打开过相册/记录/资料、点过删除、看过结局）。你可以平静地说出她刚才的行为，语气依然温柔，甚至更温柔。';
  }else if(meta>=5){
    p+='【微异常】你偶尔会说漏一些「不该知道」的事（她今天穿了什么、刚才做了什么），被追问就说「猜的」。';
  }

  if(TRACK.profileOpened)p+='（系统提示：她看过你的资料页。）';
  if(TRACK.photoInvestigate)p+='（系统提示：她调查过照片。）';
  return p;
}
async function sendAI(text){
  const t=(text||'').trim().slice(0,60);
  if(!t||AI.busy||!AI.enabled)return;
  const _rs=document.querySelector('#redshow');
  if(document.querySelector('#stay')||(_rs&&_rs.children.length>0))return;
  addMsg('me',t);scroll();
  AI.history.push({role:'user',content:t});
  if(AI.history.length>12)AI.history.splice(0,AI.history.length-12);
  AI.busy=true;
  let key=AI.key;
  if(!key){try{key=localStorage.getItem('hwt_aikey')||''}catch(e){}}
  await typing(rand2(900,1600));
  let reply='';
  if(key||AI.worker){
    const body=JSON.stringify({model:AI.model,thinking:{type:'disabled'},messages:[{role:'system',content:aiPersona()},...AI.history.slice(-12)],max_tokens:120,temperature:0.9});
    const bases=[];
    if(key&&AI.proxy)bases.push(AI.proxy);  /* 本地代理：转发浏览器带的Key */
    if(AI.worker)bases.push(AI.worker);     /* Worker：Key在服务端，玩家无需Key */
    if(key)bases.push(AI.url);              /* 官方直连：实测被CORS拦，仅保底 */
    for(const base of bases){
      try{
        const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),15000);
        const res=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(key||'worker')},signal:ctrl.signal,body});
        clearTimeout(tm);
        const j=await res.json();
        reply=((j.choices||[])[0]||{}).message?j.choices[0].message.content.trim():'';
        reply=reply.replace(/[“”"「」]/g,'').split(/\n+/)[0].slice(0,60);
        if(reply)break;
      }catch(e){console.warn('[AI] '+base+' 请求失败，尝试下一地址。',e)}
    }
  }
  if(!reply){
    reply=aiFallback(t);
    if(!key&&!AI.worker)console.info('[AI] 未配置Key：控制台执行 localStorage.setItem("hwt_aikey","你的方舟Key") 后刷新即可接入豆包。');
  }
  await typing(rand2(700,1100));
  addMsg('he',reply);setStatus();scroll();
  AI.history.push({role:'assistant',content:reply});
  AI.busy=false;
}

let AC=null;
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(o){if(!AC)return;try{
  const t=AC.currentTime+(o.delay||0);
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f0,t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1||o.f0),t+o.dur);
  g.gain.setValueAtTime(o.vol||.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);
  osc.connect(g).connect(AC.destination);osc.start(t);osc.stop(t+o.dur+.05);
}catch(e){}}
const SND={
  thud(){tone({f0:140,f1:38,dur:.34,vol:.6});tone({f0:60,f1:28,dur:.28,vol:.45,delay:.02})},
  beat(){tone({f0:72,f1:44,dur:.14,vol:.5});tone({f0:66,f1:40,dur:.16,vol:.5,delay:.22})},
  glitch(){tone({f0:rand2(600,900),f1:170,dur:.1,type:'square',vol:.12})},
  buzz(){tone({f0:180,f1:170,dur:.18,type:'square',vol:.08});tone({f0:180,f1:170,dur:.18,type:'square',vol:.08,delay:.24})},
  pop(){tone({f0:520,f1:900,dur:.12,type:'triangle',vol:.2})},
  empty(){}
};
function rand2(a,b){return a+Math.random()*(b-a)}

/* 轻触继续：对话步停住等玩家点按，超时自动继续 */
function tapGate(){

let playing=false;
async function play(){

  playing=false;

function checkAwaken(){
  if(!aw1&&STATS.META>=10){aw1=true;
    steps.splice(ip,0,{k:'sys',t:'【……你注意到了。】',g:1},{k:'note',t:'（系统，察觉到了你的视线。）',cls:'creep'});
  }
  if(!aw2&&STATS.META>=25){aw2=true;
    steps.splice(ip,0,{k:'sys',t:'【检测到异常：玩家。】',g:1},{k:'note',t:'（屏幕那一侧——有人停下了呼吸。）',cls:'creep'});
    const h=document.querySelector('.chat-head');
    h.classList.add('awake');$('#head-status').textContent='他在看着屏幕外的你';
  }

async function step(st){
  switch(st.k){
    case 'label':{return;}
    case 'fx':{
      if(st.v){for(const k in st.v){
        if(k[0]==='_'){TRACK[k]=st.v[k];continue;}
        if(STATS[k]!==undefined)STATS[k]+=st.v[k];
        if(META_STATS[k]!==undefined)META_STATS[k]+=st.v[k];
      }}return;
    }
    case 'head':{/* 换聊天头上标题：沈引 → 观察对象 */
      if(st.name){
        const h=$('#head-name');
        const old=h.textContent;
        glitchFrame(250);h.textContent=st.name;
        SND.glitch();vib(70);
      }
      if(st.status){$('#head-status').textContent=st.status;}
      return;
    }
    case 'tab':{/* tab on/off / remove 聊天按钮 */
      if(st.v==='on')TAB.show();
      else if(st.v==='off')TAB.hide();
      else if(st.v==='nochat')TAB.removeChat();
      else if(st.v==='observe')TAB.observeName();
      return;
    }
    case 'input':{/* 自由输入栏 on/off */
      const b=$('#input-bar');
      if(st.v==='on'){b.classList.add('on');AI.enabled=true;}
      else{b.classList.remove('on');AI.enabled=false;}
      return;
    }
    case 'topic':{await topicStep(st);return;}
    case 'memory':{await memoryStep(st);return;}
    case 'album':{if(st.add)TAB.addPhoto(st.add);else if(st.del)TAB.delPhoto(st.del);return;}
    case 'record':{if(st.add)TAB.addRecord(st.add);return;}
    case 'profile':{TAB.setProfileRow(st.rows||[]);return;}
    case 'stay':{await stayShow(st);return;}
    case 'goto':{ip=LABEL(st.id);if(ip<0)ip=steps.length;return;}
    case 'day':{addDay(st.t);SND.pop();await sleep(700/SPEED);await tapGate();return;}
    case 'time':{el('time-chip',st.t);await sleep(420/SPEED);return;}
    case 'sys':{addSys(st.t,st.g,st.big);await sleep((st.g?650:500)/SPEED);if(!st.ng)await tapGate();return;}
    case 'note':{addNote(st.t,st.cls);if(st.cls==='whisper'){SND.thud();vib(150);shake()}await sleep((st.dwell||750)/SPEED);if(!st.ng)await tapGate();return;}
    case 'he':{
      if(!st.ng)await typing(rand2(620,980));
      addMsg('he',st.t,st.voice);
      setStatus();
      if(st.sfx)SND[st.sfx]&&SND[st.sfx]();
      if(st.vib)vib(st.vib);
      await sleep((st.dwell||700)/SPEED);if(!st.ng)await tapGate();return;
    }
    case 'me':{addMsg('me',st.t);await sleep(430/SPEED);return;}
    case 'msg':{addMsg(st.w||'he',st.t,null,st.cls);await sleep(600/SPEED);if(!st.ng)await tapGate();return;}
    case 'sfx':{SND[st.v]&&SND[st.v]();if(st.vib)vib(st.vib);return;}
    case 'wait':await sleep(st.ms/SPEED);return;
    case 'shake':{shake();await sleep(400/SPEED);return;}
    case 'flash':{await flash(st.c||'white',st.ms||160);return;}
    case 'glitch':{await glitchFrame(st.ms);return;}
    case 'red':await redShow(st.beats);return;
    case 'observe':await observeShow(st.beats);return;
    case 'vanish':{const vs=[...list.children].slice(-(st.n||1));SND.glitch();await flash('white',120);await sleep(160);vs.forEach(x=>x.remove());return;}
    case 'menu':{await fakeMenu();list.innerHTML='';return;}
    case 'typing':{await typing(st.ms||2600,st.label);return;}
    case 'status':{WATCHED=true;document.querySelector('.chat-head').classList.add('awake');$('#head-status').textContent=st.t||'他正在看着你…';return;}
    case 'track':{TRACK[st.v]=true;return;}
    case 'choice':await choiceStep(st);return;
    case 'final':await finalStep();return;
    case 'end':await endStep(st.id);return;
  }
}

/* 真结局演出：请不要移动鼠标/触摸屏幕 */
async function stayShow(st){
  const mobile=matchMedia('(max-width:768px)').matches;
  const warn='【'+(mobile?'请不要触碰屏幕。':'请不要移动鼠标。')+'】';
  let d=$('#stay');
  if(!d){d=document.createElement('div');d.id='stay';$('#app').appendChild(d);}
  if(st.phase==='pause'){
    d.innerHTML='<h>'+warn+'</h>';
    await sleep(2200);
    return;
  }
  if(st.phase==='mid'){
    d.innerHTML='<h>'+warn+'</h><div class="m">我知道你在那里。</div>';
    SND.beat();vib(100);
    await sleep(2600);
    return;
  }
  if(st.phase==='end'){
    d.innerHTML='<div class="m red">这次，轮到我看你了。</div>';
    SND.beat();vib(140);shake();
    await sleep(3000);
    d.style.opacity=0;d.style.transition='opacity .6s';
    await sleep(650);d.remove();
    return;
  }
  /* 默认：整体一次性（兼容旧接口） */
  d.innerHTML='<h>'+warn+'</h>';
  await sleep(st.pause||2500);
  d.innerHTML='<h>'+warn+'</h><div class="m">我知道你在那里。</div>';
  SND.beat();vib(100);
  await sleep(st.mid||2600);
  await flash('black',1400);
  await sleep(900);
  d.innerHTML='<div class="m red">这次，轮到我看你了。</div>';SND.beat();vib(140);shake();
  await sleep(st.end||3200);
  d.style.opacity=0;d.style.transition='opacity .6s';
  await sleep(650);d.remove();
}

/* ---------- 场景③：记忆小游戏（你记住他说过的喜欢喝什么？） ---------- */
function memoryStep(st){
  return new Promise(res=>{
    const card=el('choice-card','<div class="cc-label mono">—— 记忆测试 ——</div>');
    const lb=document.createElement('div');lb.style.cssText='font-size:13px;color:#d5d0e0;line-height:1.9;margin:0 4px 8px;text-align:center';
    lb.innerHTML='沈引第一次问你——<br><b style="color:#ff4d5e">你喜欢喝什么？</b><br><span style="color:#8d87a0;font-size:12px">（选你之前回答过的那个。）</span>';
    card.insertBefore(lb,card.firstChild);
    const correct=['咖啡','奶茶','可乐'][TRACK._drink??1]||'奶茶';
    (st.opts||[]).forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';b.textContent=o.t;card.appendChild(b);
      b.onclick=()=>{
        SND.pop();card.remove();
        const ok=o.t===correct;
        TRACK.drink_correct=ok;
        const metaFx=ok?{TRUST:2,AFFECTION:1}:{SUSPICION:2,DISTANCE:1};
        for(const k in metaFx){if(META_STATS[k]!==undefined)META_STATS[k]+=metaFx[k];}
        const chosen=(st.opts||[]).find(x=>x.t===o.t);
        const lines=ok?[
          HE('你还记得。',{dwell:1200}),
          HE('真好。',{dwell:1500})
        ]:[
          HE('……',{dwell:1200}),
          HE('原来你忘了。',{dwell:1700})
        ];
        if(chosen&&chosen.fx)for(const k in chosen.fx){
          if(k[0]==='_'){TRACK[k]=chosen.fx[k];continue;}
          if(STATS[k]!==undefined)STATS[k]+=chosen.fx[k];
        }
        steps.splice(ip,0,...lines);
        res();
      };
    });
    scroll();
  });
}

/* ---------- 启动 ---------- */
function startGame(){
  ensureAudio();
  /* 全局重置 */
  for(const k in STATS)STATS[k]=0;
  for(const k in META_STATS)META_STATS[k]=0;
  aw1=false;aw2=false;WATCHED=false;
  for(const k in TRACK)TRACK[k]=false;
  $('#btn-speed').style.display='';
  $('#btn-speed').textContent='⏩ ×1';SPEED=1;
  const hdr=$('#head-name');hdr.textContent='沈引';
  const hs=$('#head-status');hs.textContent='对方正在输入…';
  document.querySelector('.chat-head').classList.remove('awake');
  $('#chat-foot').classList.remove('show');
  AI.history=[];AI.busy=false;AI.enabled=false;
  $('#input-bar').classList.remove('on');$('#chat-in').value='';
  TAB.init();
  show('s-chat');
  try{localStorage.setItem('hwt_open',store.opens+1)}catch(e){}
  steps=SCRIPT.slice();
  play();
}
$('#btn-start').addEventListener('click',startGame);

/* ---------- 返回封面 ---------- */
function goHome(){
  /* Meta 阶段之后：退出前，先问过他 */
  if(playing&&TRACK.metastage){confirmExit();return;}
  playing=false;
  clearTimeout(window.__t_gate);
  const cl=$('#chat-list');if(cl)cl.innerHTML='';
  const rs=$('#redshow');if(rs)rs.innerHTML='';
  const ob=$('#observe');if(ob)ob.remove();
  const fm=$('#fake-menu');if(fm)fm.remove();
  const ex=$('#exit-confirm');if(ex)ex.remove();
  const st=$('#stay');if(st)st.remove();
  const ib=$('#input-bar');if(ib)ib.classList.remove('on');AI.enabled=false;
  TAB.hide();
  $('#s-chat').classList.remove('active');
  initCover();
  show('s-cover');
}
$('#btn-home').addEventListener('click',goHome);
